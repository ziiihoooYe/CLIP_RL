# Default Config
default:
  gpu: [1,2,3]
  log_file: ckc_log.log


# Experiments Config
exp: 
  - class: evaluation
    dataset:
      class: coco_val_dataset
    args:
      sample_size: 5000
      metrics:
        - retrieval
        - uniformity
        - platonic:
            trials: 10
        - eigenfunction:
            save_path: ./eigenfunction_results

