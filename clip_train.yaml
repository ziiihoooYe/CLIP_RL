# Model Config
model:
  class: clip_vitb32

# Preprocessor Config
preprocessor:
  - class: image_preprocessor
    args:
      image_size: 224
  - class: text_preprocessor
    args:
      cutoff_length: 77
  - class: to_batch_preprocessor
    args: