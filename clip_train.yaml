# Default Config
default:
  gpu: [1, 2, 3]
  log_file: clip_log.log


# Experiments Config
exp: 
  # - class: ckc_learning
  #   dataset:
  #     class: cc12m_train_dataset
  #     # class: coco_val_dataset
  #   args:
  #     infonce_weight: 0.0
  #     epochs: 100
  #     batch_size: 256
  #     update_iter: 500
  #     ckc_temperature: 0.07
  #     num_workers: 4
  - class: evaluation
    dataset:
      class: coco_val_dataset
    args:
      sample_size: 5000
      metrics:
        - retrieval
        - uniformity
        - platonic:
            trials: 10

  - class: contrastive_learning
    dataset:
      class: cc12m_train_dataset
      # class: coco_val_dataset
    args:
      epochs: 50
      batch_size: 1024
      max_iter: 1000
      temperature_learnable: false
  
  - class: evaluation
    dataset:
      class: coco_val_dataset
    args:
      sample_size: 5000
      metrics:
        - retrieval
        - uniformity
        - platonic:
            trials: 10



# Model Config
model:
  class: clip_vitb32

# Preprocessor Config
preprocessor:
  - class: image_preprocessor
    args:
      image_size: 224
  # - class: gpt_caption_preprocessor
  #   args:
  #     model: gpt-3.5-turbo
  #     prompt: "You are a helpful assistant, please rewrite the following caption to be more descriptive and detailed: " 
  - class: text_preprocessor
    args:
      cutoff_length: 77
  - class: to_batch_preprocessor
    args: