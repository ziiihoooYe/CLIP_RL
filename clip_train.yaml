# Default Config
default:
  gpu: [5, 6, 7]
  log_file: ckc_uni_log.log


# Experiments Config
exp: 
  - class: evaluation
    dataset:
      class: coco_val_dataset
    args:
      sample_size: 5000
      metrics:
        # - retrieval
        # - uniformity
        # - platonic:
        #     trials: 10
        # - eigenfunction:
        #     save_path: ./eigenfunction_results
        - multimodal_retrieval

  - class: contrastive_learning
    dataset:
      class: cc12m_train_dataset
      # class: coco_val_dataset
    args:
      epochs: 50
      batch_size: 1024
      max_iter: 10
      temperature_learnable: false
  
  - class: evaluation
    dataset:
      class: coco_val_dataset
    args:
      sample_size: 5000
      metrics:
        # - retrieval
        # - uniformity
        # - platonic:
        #     trials: 10
        # - eigenfunction:
        #     save_path: ./eigenfunction_results
        - multimodal_retrieval

  # - class: ckc_learning
  #   dataset:
  #     # class: cc12m_train_dataset
  #     # class: cc3m_train_dataset 
  #     class: coco_val_dataset
  #   args:
  #     infonce_weight: 0.1
  #     batch_size: 5000
  #     max_iter: 50
  #     update_iter: 50
  #     ckc_temperature: 0.07


# Model Config
model:
  class: clip_vitb32


# Preprocessor Config
preprocessor:
  - class: image_preprocessor
    args:
      image_size: 224
  - class: text_preprocessor
    args:
      cutoff_length: 77
  - class: to_batch_preprocessor
    args: