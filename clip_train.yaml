default:
  exp: ContrastiveLearning
  gpu: 0
  
train:
  epochs: 50
  batch_size: 64
  lr: 1e-4
  scheduler: cosine
  temperature_init: 0.07
  temperature_learnable: true

dataset:
  class: naive_dataset
  args:
    arg3: 10

model:
  class: clip_vitb32
  args:
    gpu: 0

preprocessor:
  - class: clip_preprocessor
    args:
      image_size: 224
