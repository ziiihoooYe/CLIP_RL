clip_preprocessor:
  class: preprocessor.clip_preprocessor.CLIPPreprocessor
  args:
    image_size: 224  

masked_preprocessor:
  class: preprocessor.naive.MaskedPreprocessor
  args:
    image_size: 224
    patch_size: 16
    mask_ratio: 0.5

patch_cut_preprocessor_random:
  class: preprocessor.naive.PatchCutPreprocessor
  args:
    image_size: 224
    patch_selection: 'random'

patch_cut_preprocessor_external:
  class: preprocessor.naive.PatchCutPreprocessor
  args:
    image_size: 224
    patch_selection: 'external'